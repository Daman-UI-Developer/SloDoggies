<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account - Pet Owner SloDoggies</title>
    <meta name="description" content="">

    <link rel="icon" href="../fevicon.svg" type="image/svg+xml">

    <!-- CSS -->
    <link href="https://site-assets.fontawesome.com/releases/v6.5.2/css/all.css" rel="stylesheet">
    <link href="../css/animation.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/responsive.css" rel="stylesheet">
    <!-- CSS -->
</head>

<body class="login-flow-bdy">

    <!-- LOGIN-FLOW-PAGE -->
    <div class="login-flow-wrp">
        <div class="row">
            <div class="col-lg-8 login-flow-col w-65">
                <div class="login-flow-image">
                    <img src="../images/owner/login_flow.svg" alt="">
                </div>
            </div>
            <div class="col-lg-4 login-flow-col w-35">
                <div class="login-flow-scroll">
                    <div class="login-flow-data h-auto">
                        <div class="logo">
                            <img src="../images/logo.svg" alt="">
                        </div>
                        <h1>Create your account</h1>
                        <p>Connect with your pet community</p>
                        <ul>
                            <li><a href="../professional/login.html">
                                    <img src="../images/pet_professional_icon.svg" alt="">
                                    <img src="../images/pet_professional_icon_blk.svg" class="blk" alt="">
                                    Pet Professional
                                </a></li>
                            <li class="active"><a href="../owner/login.html">
                                    <img src="../images/pet_owner_icon.svg" alt="">
                                    <img src="../images/pet_owner_icon_blk.svg" class="blk" alt="">
                                    Pet Owner
                                </a></li>
                        </ul>
                        <form action="../owner/home.html" class="delayed-form">
                            <label>Username</label>
                            <div class="input-grp">
                                <input type="text" placeholder="Enter Username">
                            </div>
                            <label>Email/Phone</label>
                            <div class="input-grp">
                                <input type="text" placeholder="Enter Email/Phone">
                            </div>
                            <label>Password</label>
                            <div class="input-grp password-grp">
                                <input type="password" placeholder="Enter Password" class="password">
                                <div class="password-eye">
                                    <div class="eye eye-close"></div>
                                </div>
                            </div>
                            <label>Confirm Password</label>
                            <div class="input-grp mb-0 password-grp">
                                <input type="password" placeholder="Re-enter Password" class="password">
                                <div class="password-eye">
                                    <div class="eye eye-close"></div>
                                </div>
                            </div>
                            <input type="submit" value="Create Account" class="primary-cta" data-bs-toggle="modal"
                                data-bs-target="#account-created-success">
                        </form>
                        <div class="ac-switch">Already have an account? <a
                                href="../owner/create-account.html"><u>Login</u></a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- LOGIN-FLOW-PAGE -->

    <!-- ACCOUNT-CREATED-SUCCESSFULLY-POPUP -->

    <div class="modal fade small-modal" id="account-created-success" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <div class="modal-body text-center">
                    <img src="../images/popper_icon.svg" alt="">
                    <h1>Account Created Successfully!</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- ACCOUNT-CREATED-SUCCESSFULLY-POPUP -->

    <!-- JS -->
    <script src="../js/jquery.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/animation.js"></script>
    <script src="../js/custom.js"></script>
    <!-- JS -->
</body>

</html>
