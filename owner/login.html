<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pet Owner SloDoggies</title>
  <meta name="description" content="">

  <link rel="icon" href="../fevicon.svg" type="image/svg+xml">

  <!-- CSS -->
  <link href="https://site-assets.fontawesome.com/releases/v6.5.2/css/all.css" rel="stylesheet">
  <link href="../css/animation.css" rel="stylesheet">
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
  <!-- CSS -->
</head>

<body class="login-flow-bdy">

  <!-- LOGIN-FLOW-PAGE -->
  <div class="login-flow-wrp">
    <div class="row">
      <div class="col-lg-8 login-flow-col w-65">
        <div class="login-flow-image">
          <img src="../images/owner/login_flow.svg" alt="">
        </div>
      </div>
      <div class="col-lg-4 login-flow-col w-35">
        <div class="login-flow-scroll">
          <div class="login-flow-data h-auto">
            <div class="logo">
              <img src="../images/logo.svg" alt="">
            </div>
            <h1>Welcome to SloDoggies</h1>
            <p>Connect with your pet community</p>
            <ul>
              <li><a href="../professional/login.html">
                  <img src="../images/pet_professional_icon.svg" alt="">
                  <img src="../images/pet_professional_icon_blk.svg" class="blk" alt="">
                  Pet Professional
                </a></li>
              <li class="active"><a href="../owner/login.html">
                  <img src="../images/pet_owner_icon.svg" alt="">
                  <img src="../images/pet_owner_icon_blk.svg" class="blk" alt="">
                  Pet Owner
                </a></li>
            </ul>
            <form action="../owner/home.html">
              <label>Email/Phone</label>
              <div class="input-grp">
                <input type="text" placeholder="Enter Email/Phone">
              </div>
              <label>Password</label>
              <div class="input-grp mb-0 password-grp">
                <input type="password" placeholder="Enter Password" class="password">
                <div class="password-eye">
                  <div class="eye eye-close"></div>
                </div>
              </div>
              <div class="forgot-pass">
                <a href="../owner/forgot-password.html">Forgot Password?</a>
              </div>
              <input type="submit" value="Login" class="primary-cta">
            </form>
            <div class="ac-switch">New here? <a href="../owner/create-account.html"><u>Create an Account</u></a></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- LOGIN-FLOW-PAGE -->

  <!-- JS -->
  <script src="../js/jquery.js"></script>
  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/animation.js"></script>
  <script src="../js/custom.js"></script>
  <!-- JS -->
</body>

</html>
