<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - Pet Owner SloDoggies</title>
    <meta name="description" content="">

    <link rel="icon" href="../fevicon.svg" type="image/svg+xml">

    <!-- CSS -->
    <link href="https://site-assets.fontawesome.com/releases/v6.5.2/css/all.css" rel="stylesheet">
    <link href="../css/animation.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/responsive.css" rel="stylesheet">
    <!-- CSS -->
</head>

<body class="login-flow-bdy">

    <!-- LOGIN-FLOW-PAGE -->
    <div class="login-flow-wrp forgot-password-wrp">
        <div class="row">
            <div class="col-lg-8 login-flow-col w-65">
                <div class="login-flow-image">
                    <img src="../images/owner/login_flow.svg" alt="">
                </div>
            </div>
            <div class="col-lg-4 login-flow-col w-35">
                <div class="login-flow-scroll">
                    <div class="login-flow-data">
                        <a href="../owner/verify-account.html" class="back-icon"><i
                                class="fa-regular fa-arrow-left"></i></a>
                        <div class="logo">
                            <img src="../images/logo.svg" alt="">
                        </div>
                        <h1 class="mb-5">New Password</h1>
                        <form action="">
                            <label>New Password</label>
                            <div class="input-grp password-grp">
                                <input type="password" placeholder="Enter Password" class="password">
                                <div class="password-eye">
                                    <div class="eye eye-close"></div>
                                </div>
                            </div>
                            <label>Confirm Password</label>
                            <div class="input-grp mb-0 password-grp">
                                <input type="password" placeholder="Re-enter Password" class="password">
                                <div class="password-eye">
                                    <div class="eye eye-close"></div>
                                </div>
                            </div>
                            <input type="button" value="Update Password" class="primary-cta" data-bs-toggle="modal"
                                data-bs-target="#password-changed">
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- LOGIN-FLOW-PAGE -->

    <!-- PASSWORD-CHANGED-POPUP -->

    <div class="modal fade small-modal" id="password-changed" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <div class="modal-body text-center">
                    <img src="../images/popper_icon.svg" alt="">
                    <h1>Password Updated Successfully!</h1>
                    <p class="mb-3">Your password has been changed.</p>
                    <a href="../owner/login.html" class="primary-cta w-100 text-center">Go to Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- PASSWORD-CHANGED-POPUP -->

    <!-- JS -->
    <script src="../js/jquery.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/animation.js"></script>
    <script src="../js/custom.js"></script>
    <!-- JS -->
</body>

</html>
